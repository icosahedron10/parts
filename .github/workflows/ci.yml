name: offline
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -m evals.benchmark.verify
      - run: uv build
      - run: uv run python -m scripts.verify_wheel dist/cnh_parts_agent-0.1.0-py3-none-any.whl
