[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnh-parts-agent"
version = "0.1.0"
description = "Bounded, cited CNH catalog lookups for agent orchestrators"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx", "lxml", "pydantic>=2", "pydantic-settings", "python-dotenv", "langchain>=1.2", "langchain-openai", "rapidfuzz"]

[project.scripts]
cnh-parts = "cnh_parts_agent.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "deepagents"]

[tool.hatch.build.targets.wheel]
packages = ["src/cnh_parts_agent"]

[tool.hatch.build.targets.wheel.force-include]
"data/indexes" = "cnh_parts_agent/data/indexes"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: explicitly invoked site or model calls"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
